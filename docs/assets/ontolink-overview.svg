<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1070" viewBox="0 0 1200 1070" role="img" aria-labelledby="title description">
<title id="title">OntoLink skills and knowledge orchestration</title>
<desc id="description">The coordinator queries the mediator using the shared OWL model and canonical project state. A compact context packet routes work to one eligible phase skill. Actual work produces artifacts and proof. The mediator validates records, rejects conflicts and unmet gates, and atomically commits accepted changes to the project graph. Seven phases advance in order, with evidence at each handoff.</desc>
<defs>
<marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5L0 9Z" fill="#64748b"/></marker>
<marker id="green-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5L0 9Z" fill="#0f766e"/></marker>
</defs>
<rect width="1200" height="1070" rx="24" fill="#f6f8fc"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="40" y="48" font-size="16" fill="#2563eb" font-weight="700" letter-spacing="2">ONTOLINK / SKILLS &amp; KNOWLEDGE</text><text x="40" y="88" font-size="34" fill="#0f172a" font-weight="700" >How OntoLink skills work</text><text x="40" y="116" font-size="19" fill="#64748b" font-weight="400" >Eight skills. One persistent project graph. Evidence at every handoff.</text><rect x="40" y="150" width="470" height="140" rx="16" fill="#eef2ff" stroke="#c7d2fe"/><text x="64" y="181" font-size="16" fill="#4f46e5" font-weight="700" >SHARED MODEL · ontolink.owl</text><text x="64" y="215" font-size="24" fill="#1e1b4b" font-weight="700" >Vocabulary and phase routing</text><text x="64" y="244" font-size="18" fill="#334155" font-weight="400" >Phase → routesTo → Skill; ordered nextPhase links</text><text x="64" y="271" font-size="18" fill="#334155" font-weight="400" >Defines classes, relationships and required outcomes</text><rect x="690" y="150" width="470" height="140" rx="16" fill="#eaf7f3" stroke="#b4dfd2"/><text x="714" y="181" font-size="16" fill="#0f766e" font-weight="700" >PROJECT STATE · knowledge.owl</text><text x="714" y="215" font-size="24" fill="#134e4a" font-weight="700" >Persistent facts and execution state</text><text x="714" y="244" font-size="18" fill="#334155" font-weight="400" >Requirements, tasks, artifacts, evidence and blockers</text><text x="714" y="271" font-size="18" fill="#334155" font-weight="400" >Bootstrap once; reuse and validate on every resume</text><path d="M275 290 V316 H480 V350" fill="none" stroke="#64748b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M925 290 V316 H720 V350" fill="none" stroke="#64748b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="390" y="350" width="420" height="120" rx="16" fill="#172554" stroke="#172554"/><text x="414" y="380" font-size="15" fill="#a5b4fc" font-weight="700" >COORDINATOR + PYTHON MEDIATOR</text><text x="414" y="412" font-size="25" fill="#ffffff" font-weight="700" >Query compact project context</text><text x="414" y="443" font-size="17" fill="#dbeafe" font-weight="400" >Eligible task · phase skill · dependencies · gates</text><path d="M430 470 V494 H200 V540" fill="none" stroke="#64748b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="232" y="522" font-size="17" fill="#64748b" font-weight="400" >Select the eligible phase</text><rect x="40" y="540" width="320" height="155" rx="16" fill="#ffffff" stroke="#dce3ef"/><text x="64" y="573" font-size="15" fill="#2563eb" font-weight="700" >01 / EXECUTE</text><text x="64" y="607" font-size="23" fill="#0f172a" font-weight="700" >Selected phase skill</text><text x="64" y="637" font-size="17" fill="#334155" font-weight="400" >Read its contract and relevant source.</text><text x="64" y="663" font-size="17" fill="#334155" font-weight="400" >Run the available engineering tools.</text><path d="M360 618 H440" fill="none" stroke="#64748b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="440" y="540" width="320" height="155" rx="16" fill="#ffffff" stroke="#dce3ef"/><text x="464" y="573" font-size="15" fill="#2563eb" font-weight="700" >02 / CAPTURE</text><text x="464" y="607" font-size="23" fill="#0f172a" font-weight="700" >Artifacts and proof</text><text x="464" y="637" font-size="17" fill="#334155" font-weight="400" >Records and proof under .ontolink/</text><text x="464" y="663" font-size="17" fill="#334155" font-weight="400" >Application source stays in place.</text><path d="M760 618 H840" fill="none" stroke="#64748b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="840" y="540" width="320" height="155" rx="16" fill="#ffffff" stroke="#b4dfd2"/><text x="864" y="573" font-size="15" fill="#0f766e" font-weight="700" >03 / VALIDATE + RECORD</text><text x="864" y="607" font-size="23" fill="#0f172a" font-weight="700" >Guarded mediator write</text><text x="864" y="637" font-size="17" fill="#334155" font-weight="400" >Revision · SHA-256 · phase gates</text><text x="864" y="663" font-size="17" fill="#b45309" font-weight="400" >Invalid writes are rejected.</text><path d="M1080 540 V316 H1050 V290" fill="none" stroke="#0f766e" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#green-arrow)"/><text x="1105" y="500" font-size="16" fill="#0f766e" font-weight="700" transform="rotate(-90 1105 500)">Commit + audit</text><text x="440" y="726" font-size="18" fill="#475569" font-weight="400" >Commit → refresh context → select the next eligible task</text><rect x="40" y="765" width="1120" height="244" rx="16" fill="#ffffff" stroke="#dce3ef"/><text x="64" y="799" font-size="15" fill="#64748b" font-weight="700" letter-spacing="1">SEVEN PHASES / ORDERED ACCEPTANCE</text><rect x="64" y="827" width="220" height="54" rx="10" fill="#f1f5ff" stroke="#dce3ef"/><text x="78" y="860" font-size="16" fill="#6366f1" font-weight="700" >01</text><text x="112" y="861" font-size="18" fill="#1e293b" font-weight="700" >Discovery</text><rect x="348" y="827" width="220" height="54" rx="10" fill="#f1f5ff" stroke="#dce3ef"/><text x="362" y="860" font-size="16" fill="#6366f1" font-weight="700" >02</text><text x="396" y="861" font-size="18" fill="#1e293b" font-weight="700" >Architecture</text><rect x="632" y="827" width="220" height="54" rx="10" fill="#f1f5ff" stroke="#dce3ef"/><text x="646" y="860" font-size="16" fill="#6366f1" font-weight="700" >03</text><text x="680" y="861" font-size="18" fill="#1e293b" font-weight="700" >Planning</text><rect x="916" y="827" width="220" height="54" rx="10" fill="#f1f5ff" stroke="#dce3ef"/><text x="930" y="860" font-size="16" fill="#6366f1" font-weight="700" >04</text><text x="964" y="861" font-size="18" fill="#1e293b" font-weight="700" >Implementation</text><rect x="916" y="911" width="220" height="54" rx="10" fill="#f1f5ff" stroke="#dce3ef"/><text x="930" y="944" font-size="16" fill="#6366f1" font-weight="700" >05</text><text x="964" y="945" font-size="18" fill="#1e293b" font-weight="700" >Verification</text><rect x="632" y="911" width="220" height="54" rx="10" fill="#f1f5ff" stroke="#dce3ef"/><text x="646" y="944" font-size="16" fill="#6366f1" font-weight="700" >06</text><text x="680" y="945" font-size="18" fill="#1e293b" font-weight="700" >Delivery</text><rect x="348" y="911" width="220" height="54" rx="10" fill="#f1f5ff" stroke="#dce3ef"/><text x="362" y="944" font-size="16" fill="#6366f1" font-weight="700" >07</text><text x="396" y="945" font-size="18" fill="#1e293b" font-weight="700" >Monitoring</text><path d="M284 854 H348" fill="none" stroke="#64748b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M568 854 H632" fill="none" stroke="#64748b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M852 854 H916" fill="none" stroke="#64748b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M1026 881 V911" fill="none" stroke="#64748b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M916 938 H852" fill="none" stroke="#64748b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M632 938 H568" fill="none" stroke="#64748b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="64" y="932" font-size="17" fill="#475569" font-weight="400" >Each handoff requires</text><text x="64" y="956" font-size="17" fill="#475569" font-weight="700" >current PASS evidence.</text><text x="64" y="989" font-size="17" fill="#64748b" font-weight="400" >Changed upstream knowledge can reopen dependent tasks and invalidate downstream artifacts.</text><text x="40" y="1045" font-size="18" fill="#64748b" font-weight="400" >The mediator checks provenance and workflow. Agents must still inspect what the evidence proves.</text></g></svg>
